name: Fast Preflight

on:
  push:
    branches:
      - main
      - 'claude/**'
      - terry-local-wip
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance + Python gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Factory governance gate
        run: python3 tools/factory_governance_gate.py

      - name: Concept intake gate
        run: python3 tools/concept_intake_gate.py

      - name: Space mission catalog gate
        run: python3 tools/space_mission_catalog_gate.py

      - name: Celestial system gate
        run: python3 tools/celestial_system_gate.py

      - name: MK2 room manifest gate
        run: python3 tools/mk2_room_manifest_gate.py

      - name: Fast Python gate tests
        shell: bash
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/fast-python-gates.log"
          if python3 -m unittest discover \
            -s tools/tests \
            -p 'test_*_gate.py' \
            -v >"$log" 2>&1; then
            tail -n 25 "$log"
          else
            echo "::error::Fast Python gate tests failed. Showing the final 160 lines."
            tail -n 160 "$log"
            exit 1
          fi

      - name: Commit whitespace and conflict check
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --cached
          fi
