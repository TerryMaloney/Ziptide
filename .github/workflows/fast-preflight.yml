name: Fast Preflight

on:
  push:
    branches:
      - main
      - 'claude/**'
      - terry-local-wip
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance + Python gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          show-progress: false

      - name: Factory governance gate
        run: python3 tools/factory_governance_gate.py

      - name: Concept intake gate
        run: python3 tools/concept_intake_gate.py

      - name: Space mission catalog gate
        run: python3 tools/space_mission_catalog_gate.py

      - name: Celestial system gate
        run: python3 tools/celestial_system_gate.py

      - name: MK2 room manifest gate
        run: python3 tools/mk2_room_manifest_gate.py

      - name: Unified offline readiness report
        run: |
          python3 tools/offline_readiness_report.py \
            --source-sha "${GITHUB_SHA}" \
            --output Builds/Reports/offline_readiness.json

      - name: Fast Python gate tests
        id: python-gates
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p Builds/Reports
          log="Builds/Reports/fast-python-gates.log"
          if python3 -m unittest discover \
            -s tools/tests \
            -p 'test_*_gate.py' \
            -v >"$log" 2>&1; then
            tail -n 25 "$log"
          else
            echo "::error::Fast Python gate tests failed. See fast-preflight-evidence artifact."
            tail -n 50 "$log"
            exit 1
          fi

      - name: Upload fast preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-preflight-evidence-${{ github.sha }}
          path: |
            Builds/Reports/offline_readiness.json
            Builds/Reports/fast-python-gates.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit whitespace and conflict check
        if: always() && steps.python-gates.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --cached
          fi
