name: Recovery Golden Android

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-golden-android.yml'
      - '.github/workflows/recovery-playmode.yml'
      - 'docs/worldimprovements/**'
      - 'Ziptide/Assets/Ziptide/Core/Runtime/Recovery/**'
      - 'Ziptide/Assets/Ziptide/Core/Runtime/WorldImprovementAssessmentCore.cs'
      - 'Ziptide/Assets/Ziptide/Content/WorldImprovement/**'
      - 'Ziptide/Assets/Ziptide/Editor/Build/**'
      - 'Ziptide/Assets/Ziptide/Editor/WorldImprovement/**'
      - 'Ziptide/Assets/Ziptide/Editor/Audit/**'
      - 'Ziptide/Assets/Ziptide/Editor/Patching/ForgeBaker.cs'
      - 'Ziptide/Assets/Ziptide/Editor/Patching/ShipHullBuilder.cs'
      - 'Ziptide/Assets/Ziptide/Editor/Patching/ToxicCity*.cs'
      - 'Ziptide/Assets/Ziptide/Editor/Art/ForgeDependencyAuditor.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Items/**'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/**'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/World/**'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Story/RepairableMachine.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Story/ShipCastOffRuntime.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Weapons/**'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Audio/AmbienceDirector.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/**'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Enemies/EcologyDirector.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Pvp/PvpProgressionRuntime.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Photo/QuartersCameraFeature.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Tutorial/FirstHourObservationAdapter.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Tutorial/HomeHubRuntime.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Diagnostics/SingletonValidator.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Inventory/QuickSwap.cs'
      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Locomotion/DashLocomotion.cs'
      - 'Ziptide/Assets/Ziptide/Tests/PlayMode/Recovery*.cs'
      - 'Ziptide/Assets/Ziptide/Tests/EditMode/WorldImprovement*.cs'
      - 'Ziptide/Assets/Ziptide/Tests/EditMode/RoundThree*.cs'
      - 'Ziptide/Assets/Ziptide/Tests/EditMode/Quest*.cs'
      - 'Ziptide/Assets/Ziptide/Tests/EditMode/*PerceptualAuditRulesTests.cs'
      - 'Ziptide/Assets/Ziptide/Tests/EditMode/RouteContinuityAuditRulesTests.cs'
      - 'Ziptide/Assets/Ziptide/Tests/EditMode/InteractionReachAuditRulesTests.cs'
      - 'Ziptide/Assets/Ziptide/Tests/EditMode/BuildProfileTravelAuditRulesTests.cs'
      - 'Ziptide/Assets/Ziptide/Scenes/_Boot.unity'
      - 'Ziptide/Assets/Ziptide/Scenes/Generated/W000_DriftIn.unity'
      - 'Ziptide/Assets/Ziptide/Scenes/ToxicCity.unity'
      - 'Ziptide/Assets/Ziptide/Content/Worlds/Packs/ToxicCityExit_WorldPack.asset'
      - 'Ziptide/Assets/Ziptide/Resources/Items/BreakerBlade.asset'
      - 'Ziptide/Assets/Ziptide/Resources/ZiptideTransparentAlphaUnlit.shader*'
      - 'Ziptide/Assets/Ziptide/Resources/ZiptideAdditiveUnlit.shader*'
      - 'Ziptide/Assets/Ziptide/Visuals/Runtime/Forge/PracticalLight.cs'
      - 'Ziptide/Assets/Ziptide/Visuals/Runtime/Grounding/GroundShadow.cs'
      - 'Ziptide/Assets/Ziptide/Visuals/Runtime/SkyVistas/SkyAtmosphereRig.cs'
      - 'Ziptide/Assets/ZiptideNet/NetBootstrap.cs'
      - 'docs/recovery/automatic_runtime_owners.json'
      - 'docs/recovery/golden_slice_manifest.json'
      - 'tools/dev_build_install.ps1'
      - 'tools/quest_smoke.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-golden-android-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: Ziptide
  UNITY_VERSION: 6000.2.9f1

jobs:
  build-golden-apk:
    name: Build locked Golden APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space for Unity Android image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: true

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "event_sha=${GITHUB_SHA}"
          echo "checkout_sha=${actual}"
          test "$actual" = "$GITHUB_SHA"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-recovery-golden-android-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-recovery-golden-android-
            Library-android-
            Library-

      - name: Build exact Golden Android player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Ziptide.Build.RecoveryBuildAndroid.PatchScenesThenGoldenAPK
          allowDirtyBuild: true

      - name: Verify Golden build and Round 3 evidence independently
        shell: bash
        run: |
          set -euo pipefail
          apk="${PROJECT_PATH}/Builds/Android/Ziptide.apk"
          report="${PROJECT_PATH}/Builds/Reports/recovery_golden_build_profile.json"
          improvement="${PROJECT_PATH}/Builds/Reports/world_improvement_compile.json"
          test -s "$apk"
          test -s "$report"
          test -s "$improvement"

          python3 - "$report" "$apk" "$improvement" <<'PY'
          import json
          import os
          import sys

          report_path, apk_path, improvement_path = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(report_path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)
          with open(improvement_path, "r", encoding="utf-8") as handle:
              improvement = json.load(handle)

          expected_scenes = [
              "Assets/Ziptide/Scenes/_Boot.unity",
              "Assets/Ziptide/Scenes/Generated/W000_DriftIn.unity",
              "Assets/Ziptide/Scenes/ToxicCity.unity",
          ]
          assert payload.get("profile") == "GoldenSlice", payload
          assert payload.get("define") == "ZIPTIDE_RECOVERY_GOLDEN", payload
          assert payload.get("result") == "Succeeded", payload
          assert payload.get("scenes") == expected_scenes, payload
          assert int(payload.get("totalBytes", 0)) > 0, payload
          assert os.path.getsize(apk_path) > 0, apk_path

          assert improvement.get("schemaVersion") == 2, improvement
          assert improvement.get("compilerVersion") == 2, improvement
          records = {row.get("sceneName"): row for row in improvement.get("worlds", [])}
          expected_manifests = {
              "W000_DriftIn": "ziptide-w000-round3",
              "ToxicCity": "ziptide-toxiccity-round3",
          }
          expected_modules = {
              "arrival_identity", "route_beacons", "ambient_motion", "horizon_frame",
              "grounded_route", "discovery_nodes", "story_traces",
          }
          for scene_name, manifest_id in expected_manifests.items():
              row = records.get(scene_name)
              assert row, (scene_name, improvement)
              assert row.get("manifestId") == manifest_id, row
              assert row.get("round") == 3, row
              assert row.get("recipeVersion") == 1, row
              assert len(row.get("recipeHash", "")) == 64, row
              modules = row.get("modules", [])
              counts = row.get("objectCounts", [])
              assert set(modules) == expected_modules, row
              assert len(modules) == len(counts) == 7, row
              assert all(int(value) > 0 for value in counts), row
              names = row.get("aspectNames", [])
              scores = row.get("aspectScores", [])
              weakest = row.get("weakestAspects", [])
              assert len(names) == len(scores) == 9, row
              assert all(int(value) > 0 for value in scores), row
              assert 1 <= len(weakest) <= 3, row
              assert all(value in names for value in weakest), row

          print(json.dumps({
              "verified": True,
              "profile": payload["profile"],
              "define": payload["define"],
              "scenes": payload["scenes"],
              "reportedBytes": payload["totalBytes"],
              "apkBytes": os.path.getsize(apk_path),
              "improvementCompiler": improvement["compilerVersion"],
              "improvedGoldenScenes": expected_manifests,
          }, indent=2))
          PY

          sha256sum "$apk" "$report" "$improvement"

      - name: Upload Golden candidate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-golden-apk-${{ github.sha }}
          path: |
            ${{ env.PROJECT_PATH }}/Builds/Android/Ziptide.apk
            ${{ env.PROJECT_PATH }}/Builds/Reports/recovery_golden_build_profile.json
            ${{ env.PROJECT_PATH }}/Builds/Reports/world_improvement_compile.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload patch and world-audit evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-golden-audit-${{ github.sha }}
          path: |
            docs/AUDIT_REPORT.*
            ${{ env.PROJECT_PATH }}/Builds/Reports/*
          if-no-files-found: warn
          retention-days: 90

  record-observation:
    name: Record durable Golden Android observation
    needs: build-golden-apk
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/terry-local-wip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout current branch head
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Refuse stale observation writes
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          tested="${{ github.sha }}"
          current="$(git rev-parse HEAD)"
          echo "tested=$tested"
          echo "current=$current"
          if [[ "$current" == "$tested" ]]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git cat-file -e "${tested}^{commit}"
          changed="$(git diff --name-only "$tested" HEAD)"
          echo "$changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              docs/recovery/generated/*|docs/CI_VERDICT.md|docs/HANDOFF.md)
                ;;
              *)
                echo "write=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Branch advanced through proof-relevant path '$path'; newer source owns the observation."
                exit 0
                ;;
            esac
          done <<< "$changed"
          echo "write=true" >> "$GITHUB_OUTPUT"

      - name: Render observation
        if: steps.freshness.outputs.write == 'true'
        shell: bash
        env:
          TESTED_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RESULT: ${{ needs.build-golden-apk.result }}
        run: |
          set -euo pipefail
          mkdir -p docs/recovery/generated
          python3 - <<'PY'
          import os
          from pathlib import Path

          tested_sha = os.environ["TESTED_SHA"]
          run_id = os.environ["WORKFLOW_RUN_ID"]
          attempt = os.environ["WORKFLOW_ATTEMPT"]
          result = os.environ["BUILD_RESULT"]
          unity = os.environ["UNITY_VERSION"]
          text = f"""# Recovery Golden Android Observation

          - Tested SHA: `{tested_sha}`
          - Workflow run: `{run_id}`
          - Attempt: `{attempt}`
          - Build/verification result: **{result}**
          - Unity: {unity}
          - Build method: `Ziptide.Build.RecoveryBuildAndroid.PatchScenesThenGoldenAPK`
          - Compile define: `ZIPTIDE_RECOVERY_GOLDEN`
          - Locked scenes: `_Boot`, `W000_DriftIn`, `ToxicCity`
          - Candidate artifact: `recovery-golden-apk-{tested_sha}`
          - Audit artifact: `recovery-golden-audit-{tested_sha}`
          - Improvement evidence: `world_improvement_compile.json` independently verified for W000/ToxicCity Round 3
          """
          Path("docs/recovery/generated/recovery_golden_android_observation.md").write_text(text, encoding="utf-8")
          PY

      - name: Commit observation without forcing
        if: steps.freshness.outputs.write == 'true'
        shell: bash
        run: |
          set -euo pipefail
          path="docs/recovery/generated/recovery_golden_android_observation.md"
          if git diff --quiet -- "$path"; then
            echo "::notice::Observation already matches this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "ci(recovery): record Golden Android observation for ${GITHUB_SHA:0:7} [skip ci]"
          if ! git push origin HEAD:terry-local-wip; then
            echo "::warning::Branch advanced during observation write; no force push attempted."
            exit 0
          fi
