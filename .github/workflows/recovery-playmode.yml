name: Apply reviewed input-session patch through PlayMode lane

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-playmode.yml'

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current recovery branch
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Apply exact reviewed patch, restore workflow, and publish source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          runner = Path('.github/workflows/recovery-run-input-session-stability.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = runner.index(marker) + len(marker)
          end = runner.index("\n          PY\n\n          git config", start)
          script = textwrap.dedent(runner[start:end])
          exec(compile(script, 'reviewed_input_session_patch.py', 'exec'), {'__name__': '__main__'})
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Restore the proven normal PlayMode workflow from the target branch's pre-merge parent.
          git checkout HEAD^ -- .github/workflows/recovery-playmode.yml
          git rm -f \
            .github/workflows/recovery-apply-input-session-stability.yml \
            .github/workflows/recovery-run-input-session-stability.yml
          git add \
            .github/workflows/recovery-playmode.yml \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerRigPersistence.cs \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerInputSessionGuard.cs \
            Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryInputSessionGuardTests.cs
          git diff --cached --check
          git commit -m "fix(input): preserve per-action state through travel wiring"

          if ! git push origin HEAD:terry-local-wip; then
            git fetch origin terry-local-wip
            git rebase origin/terry-local-wip
            git push origin HEAD:terry-local-wip
          fi
