name: Recovery PlayMode Observation

# R1.1 infrastructure spike. This workflow is intentionally separate from the durable
# Unity verdict until it proves two green runs. A red result remains visible and honest;
# it does not weaken or replace the required EditMode + patch/audit jobs.
on:
  push:
    branches:
      - terry-local-wip
    paths:
      - 'Ziptide/Assets/Ziptide/Tests/PlayMode/**'
      - 'docs/recovery/playmode_repeat_probe.md'
      - '.github/workflows/recovery-playmode.yml'
  workflow_dispatch:

permissions:
  checks: write
  contents: write

env:
  PROJECT_PATH: Ziptide
  UNITY_VERSION: 2022.3.62f3

concurrency:
  group: recovery-playmode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playmode-smoke:
    name: PlayMode one-frame smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: true

      - name: Cache isolated PlayMode Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-playmode-r1-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-playmode-r1-
            Library-

      - name: Run PlayMode infrastructure test
        id: playmode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: playmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: playmode-test-results

      - name: Render durable PlayMode observation
        if: always()
        shell: bash
        run: |
          mkdir -p docs/recovery/generated
          cat > docs/recovery/generated/recovery_playmode_observation.md <<EOF
          # Recovery PlayMode Observation

          - Tested SHA: \`${GITHUB_SHA}\`
          - Workflow run: \`${GITHUB_RUN_ID}\`
          - Attempt: \`${GITHUB_RUN_ATTEMPT}\`
          - Test step outcome: **${{ steps.playmode.outcome }}**
          - Scope: R1.1 one-frame lifecycle infrastructure only
          - Unity: ${UNITY_VERSION}
          - Promotion state: observation; requires two green runs before becoming a recovery-required lane
          EOF

      - name: Upload PlayMode results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-playmode-r1-results
          path: |
            playmode-test-results
            docs/recovery/generated/recovery_playmode_observation.md
          if-no-files-found: warn

      - name: Commit durable observation on current branch head
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp docs/recovery/generated/recovery_playmode_observation.md /tmp/recovery_playmode_observation.md
          git fetch origin terry-local-wip
          git checkout -B terry-local-wip origin/terry-local-wip
          mkdir -p docs/recovery/generated
          cp /tmp/recovery_playmode_observation.md docs/recovery/generated/recovery_playmode_observation.md
          if git diff --quiet -- docs/recovery/generated/recovery_playmode_observation.md && \
             [[ -z "$(git status --porcelain -- docs/recovery/generated/recovery_playmode_observation.md)" ]]; then
            echo "PlayMode observation already matches this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recovery/generated/recovery_playmode_observation.md
          git commit -m "ci(playmode): record observation for ${GITHUB_SHA:0:7} [skip ci]"
          if ! git push origin HEAD:terry-local-wip; then
            echo "::warning::Branch advanced during PlayMode observation write; artifact still preserves this run."
          fi
