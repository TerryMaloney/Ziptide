name: Apply transparent reviewed input-session patch

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-playmode.yml'

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current recovery branch
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Apply named source edits and publish the real patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_input_session_patch.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout 9a9fe6610152616fcb2feb8a64008f33d507d15b -- .github/workflows/recovery-playmode.yml
          git rm -f \
            .github/scripts/apply_input_session_patch.py \
            .github/workflows/recovery-apply-input-session-stability.yml \
            .github/workflows/recovery-run-input-session-stability.yml
          git add \
            .github/workflows/recovery-playmode.yml \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerRigPersistence.cs \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerInputSessionGuard.cs \
            Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryInputSessionGuardTests.cs
          git diff --cached --check
          git commit -m "fix(input): preserve per-action state through travel wiring"
          git push origin HEAD:terry-local-wip
