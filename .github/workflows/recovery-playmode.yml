name: Apply clean Unity package-cache contract

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-playmode.yml'

permissions:
  contents: write

jobs:
  apply-cache-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current recovery branch
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Restore normal workflow, apply cache contract, and publish
        shell: bash
        run: |
          set -euo pipefail

          # Restore the normal PlayMode workflow from the target branch's pre-merge parent before
          # applying the permanent cache/trigger edits.
          git checkout HEAD^ -- .github/workflows/recovery-playmode.yml
          python3 .github/scripts/apply_clean_unity_package_cache_contract.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_clean_unity_package_cache_contract.py
          git add \
            .github/workflows/recovery-playmode.yml \
            .github/workflows/recovery-golden-android.yml \
            .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "ci(recovery): isolate Unity Libraries by package graph"
          git push origin HEAD:terry-local-wip
