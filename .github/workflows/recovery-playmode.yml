name: Apply disabled-reference readiness contract

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-playmode.yml'

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current recovery branch
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Apply readiness predicate and extend existing canary
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_disabled_reference_readiness.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout HEAD^ -- .github/workflows/recovery-playmode.yml
          git rm -f .github/scripts/apply_disabled_reference_readiness.py
          git add \
            .github/workflows/recovery-playmode.yml \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerRigPersistence.cs \
            Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryInputSessionGuardTests.cs
          git diff --cached --check
          git commit -m "fix(input): distinguish disabled references from direct actions"
          git push origin HEAD:terry-local-wip
