name: Apply robust clean Unity package-cache contract

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-playmode.yml'

permissions:
  contents: write

jobs:
  apply-cache-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current recovery branch
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Restore normal workflow, apply robust cache contract, and publish
        shell: bash
        run: |
          set -euo pipefail

          # Restore the last proven normal PlayMode workflow, then apply only the permanent
          # package-trigger/cache/artifact changes with line-based transformations.
          git checkout b3e4eded13546871e9b4ff6320983fa4f3147afc -- .github/workflows/recovery-playmode.yml
          python3 .github/scripts/apply_clean_unity_package_cache_contract.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_clean_unity_package_cache_contract.py
          git add \
            .github/workflows/recovery-playmode.yml \
            .github/workflows/recovery-golden-android.yml \
            .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "ci(recovery): isolate Unity Libraries by package graph"
          git push origin HEAD:terry-local-wip
