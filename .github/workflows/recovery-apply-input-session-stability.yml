name: Apply bounded input-session stability patch

on:
  push:
    branches:
      - recovery/input-session-stability
    paths:
      - '.github/workflows/recovery-apply-input-session-stability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/input-session-stability
          fetch-depth: 0

      - name: Apply exact reviewed source replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exact source block once, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          rig = 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerRigPersistence.cs'
          guard = 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerInputSessionGuard.cs'
          test = 'Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryInputSessionGuardTests.cs'

          replace_once(rig, '''        // Belt-and-suspenders for the anchor bug: hard-disable the two input actions the right thumbstick is
        // bound to for anchor control ("Rotate Anchor" / "Translate Anchor" in the Interaction map). Even if
        // the interactor gate above is ever re-enabled, no input reaches the manipulation. Runs AFTER
        // EnsurePersistentInputActions() (which Enable()s the whole asset) and on every scene load, so the
        // two actions stay off while everything else (grab, turn, move) stays live.
        private void DisableAnchorInputActions()
        {
            var primary = _xriManager != null ? _xriManager.GetComponent<InputActionManager>() : null;
            if (primary == null || primary.actionAssets == null) return;
            int disabled = 0;
            foreach (var asset in primary.actionAssets)
            {
                if (asset == null) continue;
                foreach (var map in asset.actionMaps)
                {
                    if (map == null) continue;
                    foreach (var action in map.actions)
                    {
                        if (action == null) continue;
                        if (action.name == "Rotate Anchor" || action.name == "Translate Anchor")
                        {
                            action.Disable();
                            disabled++;
                        }
                    }
                }
            }
            Debug.Log("ZIPTIDE: ANCHOR_ACTIONS_DISABLED count=" + disabled);
        }
''', '''        // Belt-and-suspenders for the anchor bug: hard-disable the two input actions the right thumbstick is
        // bound to for anchor control ("Rotate Anchor" / "Translate Anchor" in the Interaction map). Even if
        // the interactor gate above is ever re-enabled, no input reaches the manipulation. Runs AFTER
        // EnsurePersistentInputActions(), which now recovers only a fully disabled asset. A normally-live,
        // partially enabled canonical asset is left untouched, so world travel no longer re-enables and then
        // re-disables these actions — the churn that invalidated Turn processors on the following frame.
        private void DisableAnchorInputActions()
        {
            var primary = _xriManager != null ? _xriManager.GetComponent<InputActionManager>() : null;
            if (primary == null || primary.actionAssets == null) return;
            int found = 0;
            int changed = 0;
            foreach (var asset in primary.actionAssets)
            {
                if (asset == null) continue;
                foreach (var map in asset.actionMaps)
                {
                    if (map == null) continue;
                    foreach (var action in map.actions)
                    {
                        if (action == null) continue;
                        if (action.name == "Rotate Anchor" || action.name == "Translate Anchor")
                        {
                            found++;
                            if (!action.enabled) continue;
                            action.Disable();
                            changed++;
                        }
                    }
                }
            }
            Debug.Log("ZIPTIDE: ANCHOR_ACTIONS_DISABLED count=" + found + " changed=" + changed);
        }
''')

          replace_once(rig, '''            // Keep the assets enabled (idempotent). Restores input if a prior unload disabled them.
            foreach (var a in assets)
                a.Enable();
''', '''            // Asset.Enable() is NOT idempotent when selected actions are intentionally disabled: it
            // re-enables every action and forces a shared InputActionState rebuild. Preserve a live asset's
            // exact per-action state; recover only an asset that is completely disabled.
            int recoveredAssets = 0;
            foreach (var a in assets)
            {
                if (a == null || a.enabled) continue;
                a.Enable();
                recoveredAssets++;
            }
            if (recoveredAssets > 0)
                Debug.Log("ZIPTIDE: INPUT_ASSET_RECOVERED count=" + recoveredAssets);
''')

          replace_once(rig, '''        private void SuspendLocomotionReadersForInputMutation()
        {
            if (_mutationReaderRestore != null) return; // window already open; restorer owns the set
            CollectForMutation(GetComponentsInChildren<ActionBasedContinuousMoveProvider>(true));
            CollectForMutation(GetComponentsInChildren<ActionBasedContinuousTurnProvider>(true));
            CollectForMutation(GetComponentsInChildren<ActionBasedSnapTurnProvider>(true));
            if (_mutationSuspendedReaders.Count == 0) return;
            _mutationReaderRestore = StartCoroutine(RestoreReadersAfterInputSettle());
        }
''', '''        private void SuspendLocomotionReadersForInputMutation()
        {
            if (_mutationReaderRestore != null) return; // window already open; restorer owns the set
            // A prior fail-closed attempt deliberately leaves its owned readers suspended. Reuse that exact
            // set on the next wiring pass instead of losing ownership because disabled readers are not recollected.
            if (_mutationSuspendedReaders.Count == 0)
            {
                CollectForMutation(GetComponentsInChildren<ActionBasedContinuousMoveProvider>(true));
                CollectForMutation(GetComponentsInChildren<ActionBasedContinuousTurnProvider>(true));
                CollectForMutation(GetComponentsInChildren<ActionBasedSnapTurnProvider>(true));
            }
            if (_mutationSuspendedReaders.Count == 0) return;
            _mutationReaderRestore = StartCoroutine(RestoreReadersAfterInputSettle());
        }
''')

          replace_once(rig, '''        private IEnumerator RestoreReadersAfterInputSettle()
        {
            // Frame counts are not a settle guarantee: run 29518294931 showed the FIRST poll after a
            // two-frame wait still hitting the ApplyProcessors NRE. Run 29518996619 went further —
            // a PASSING probe followed by a clean MOVE_DIAG read still preceded a ContinuousTurn NRE,
            // because the restore landed while the TRAVEL COROUTINE was still running and input churn
            // (manager adoption, asset clears, guard reasserts) had not finished. The identical route
            // reads clean in steady state (the perf-route legs), so the rule is: readers stay
            // suspended until travel has fully ENDED, then probe-settle, then two extra frames.
            yield return null;
            float travelDeadline = Time.realtimeSinceStartup + 45f; // covers the 30 s scene-load budget
            while (Time.realtimeSinceStartup < travelDeadline && TravelCoordinator.IsTravelling)
                yield return null;

            float deadline = Time.realtimeSinceStartup + 2f;
            while (Time.realtimeSinceStartup < deadline && !SuspendedReaderActionsReadSafely())
                yield return null;
            if (!SuspendedReaderActionsReadSafely())
                Debug.LogWarning("ZIPTIDE: INPUT_MUTATION_SETTLE_TIMEOUT — re-enabling readers anyway");
            yield return null;
            yield return null; // two settled frames beyond the last clean probe

            bool handedToBootHold = _bootHold.Held;
            foreach (var b in _mutationSuspendedReaders)
            {
                if (b == null) continue;
                if (handedToBootHold) _bootSuspended.Add(b);
                else b.enabled = true;
            }
            Debug.Log("ZIPTIDE: INPUT_MUTATION_READERS restored=" + _mutationSuspendedReaders.Count
                + (handedToBootHold ? " handedTo=bootHold" : ""));
            _mutationSuspendedReaders.Clear();
            _mutationReaderRestore = null;
        }

        /// <summary>True when every action the suspended readers poll reads without throwing —
        /// i.e. the InputActionState re-resolution triggered by the wiring mutation has completed.</summary>
        private bool SuspendedReaderActionsReadSafely()
        {
            foreach (var b in _mutationSuspendedReaders)
            {
                switch (b)
                {
                    case ActionBasedContinuousMoveProvider move:
                        if (!ActionReadsSafely(move.leftHandMoveAction) ||
                            !ActionReadsSafely(move.rightHandMoveAction)) return false;
                        break;
                    case ActionBasedContinuousTurnProvider turn:
                        if (!ActionReadsSafely(turn.leftHandTurnAction) ||
                            !ActionReadsSafely(turn.rightHandTurnAction)) return false;
                        break;
                    case ActionBasedSnapTurnProvider snap:
                        if (!ActionReadsSafely(snap.leftHandSnapTurnAction) ||
                            !ActionReadsSafely(snap.rightHandSnapTurnAction)) return false;
                        break;
                }
            }
            return true;
        }

        private static bool ActionReadsSafely(InputActionProperty property)
        {
            var action = property.action;
            if (action == null || !action.enabled) return true; // nothing to settle
            try
            {
                action.ReadValue<Vector2>();
                return true;
            }
            catch (System.NullReferenceException)
            {
                return false; // InputActionState still mid-re-resolve — the exact NRE the readers would hit
            }
            catch (System.InvalidOperationException)
            {
                return false; // value-type mismatch during re-resolve — equally unsafe to poll
            }
        }
''', '''        private IEnumerator RestoreReadersAfterInputSettle()
        {
            // A disabled provider can own a DIRECT InputAction. Calling the action probe while that provider
            // is disabled used to return "safe" merely because the action was disabled; OnEnable then enabled
            // the direct action, started a fresh re-resolve, and Snap/Continuous Turn crashed on its first poll.
            // Prepare direct actions while readers are quiescent and require two consecutive safe frames.
            yield return null;
            float travelDeadline = Time.realtimeSinceStartup + 45f; // covers the 30 s scene-load budget
            while (Time.realtimeSinceStartup < travelDeadline && TravelCoordinator.IsTravelling)
                yield return null;

            float deadline = Time.realtimeSinceStartup + 3f;
            int stableFrames = 0;
            int probes = 0;
            int directActionsPrepared = 0;
            while (Time.realtimeSinceStartup < deadline && stableFrames < 2)
            {
                int preparedThisProbe;
                bool safe = SuspendedReaderActionsReadSafely(out preparedThisProbe);
                directActionsPrepared += preparedThisProbe;
                probes++;
                stableFrames = safe ? stableFrames + 1 : 0;
                if (stableFrames < 2) yield return null;
            }

            if (stableFrames < 2)
            {
                // Fail closed: a known-unsafe reader must never be deliberately re-enabled. The Error is a
                // blocking PlayMode signal; on device the player gets disabled locomotion instead of a crash.
                Debug.LogError("ZIPTIDE: INPUT_MUTATION_SETTLE_FAIL probes=" + probes
                    + " directPrepared=" + directActionsPrepared + " readers="
                    + _mutationSuspendedReaders.Count);
                _mutationReaderRestore = null;
                yield break;
            }

            bool handedToBootHold = _bootHold.Held;
            foreach (var b in _mutationSuspendedReaders)
            {
                if (b == null) continue;
                if (handedToBootHold) _bootSuspended.Add(b);
                else b.enabled = true;
            }
            Debug.Log("ZIPTIDE: INPUT_MUTATION_READERS restored=" + _mutationSuspendedReaders.Count
                + " probes=" + probes + " directPrepared=" + directActionsPrepared
                + (handedToBootHold ? " handedTo=bootHold" : ""));
            _mutationSuspendedReaders.Clear();
            _mutationReaderRestore = null;
        }

        /// <summary>True when every action the suspended readers will poll is enabled and readable.
        /// Direct actions are enabled here while their providers are still quiescent, so provider OnEnable
        /// cannot begin a new InputActionState rebuild after the readiness proof.</summary>
        private bool SuspendedReaderActionsReadSafely(out int directActionsPrepared)
        {
            directActionsPrepared = 0;
            foreach (var b in _mutationSuspendedReaders)
            {
                switch (b)
                {
                    case ActionBasedContinuousMoveProvider move:
                        if (!ActionReadsSafely(move.leftHandMoveAction, ref directActionsPrepared) ||
                            !ActionReadsSafely(move.rightHandMoveAction, ref directActionsPrepared)) return false;
                        break;
                    case ActionBasedContinuousTurnProvider turn:
                        if (!ActionReadsSafely(turn.leftHandTurnAction, ref directActionsPrepared) ||
                            !ActionReadsSafely(turn.rightHandTurnAction, ref directActionsPrepared)) return false;
                        break;
                    case ActionBasedSnapTurnProvider snap:
                        if (!ActionReadsSafely(snap.leftHandSnapTurnAction, ref directActionsPrepared) ||
                            !ActionReadsSafely(snap.rightHandSnapTurnAction, ref directActionsPrepared)) return false;
                        break;
                }
            }
            return true;
        }

        private static bool ActionReadsSafely(InputActionProperty property, ref int directActionsPrepared)
        {
            var action = property.action;
            if (action == null) return true;
            try
            {
                if (!action.enabled)
                {
                    // InputActionReferences are owned by the canonical InputActionManager; if one is off,
                    // the session has not settled. Direct actions are provider-owned, so prepare them now.
                    if (property.reference != null) return false;
                    action.Enable();
                    directActionsPrepared++;
                }
                action.ReadValue<Vector2>();
                return true;
            }
            catch (System.NullReferenceException)
            {
                return false; // InputActionState still mid-re-resolve — the exact NRE the readers would hit
            }
            catch (System.InvalidOperationException)
            {
                return false; // value-type mismatch during re-resolve — equally unsafe to poll
            }
        }
''')

          replace_once(guard, '''            primary.actionAssets = assets;
            primary.enabled = true;
            for (int i = 0; i < assets.Count; i++)
                if (assets[i] != null) assets[i].Enable();

            int disabled = 0;
''', '''            primary.actionAssets = assets;
            primary.enabled = true;

            // Do not call Enable() on a partially enabled asset. Asset.Enable() re-enables intentional
            // per-action disables (Rotate/Translate Anchor) and rebuilds shared action state mid-travel.
            int recoveredAssets = 0;
            for (int i = 0; i < assets.Count; i++)
            {
                InputActionAsset asset = assets[i];
                if (asset == null || asset.enabled) continue;
                asset.Enable();
                recoveredAssets++;
            }

            int disabled = 0;
''')

          replace_once(guard, '''            Debug.Log("ZIPTIDE: INPUT_SESSION_CANONICAL manager=" + HierarchyPath(primary.transform)
                + " assets=" + assets.Count + " duplicatesDisabled=" + disabled
                + " reason=" + reason);
''', '''            Debug.Log("ZIPTIDE: INPUT_SESSION_CANONICAL manager=" + HierarchyPath(primary.transform)
                + " assets=" + assets.Count + " duplicatesDisabled=" + disabled
                + " recoveredAssets=" + recoveredAssets + " reason=" + reason);
''')

          replace_once(test, '''            InputActionAsset primaryAsset = CreateAsset("PrimaryAsset", "PrimaryAction");
            primary.actionAssets = new List<InputActionAsset> { primaryAsset };
            primaryAsset.Enable();

            GameObject duplicateHost = CreateHost("__RECOVERY_SCENE_INPUT_MANAGER");
            InputActionManager duplicate = duplicateHost.AddComponent<InputActionManager>();
            InputActionAsset duplicateAsset = CreateAsset("SceneAsset", "SceneAction");
            duplicate.actionAssets = new List<InputActionAsset> { duplicateAsset };
            duplicateAsset.Enable();
''', '''            InputActionAsset primaryAsset = CreateAsset("PrimaryAsset", "PrimaryAction");
            InputAction primaryHeldOff = primaryAsset.FindActionMap("TestMap")
                .AddAction("Rotate Anchor", InputActionType.Value);
            primary.actionAssets = new List<InputActionAsset> { primaryAsset };
            primaryAsset.Enable();
            primaryHeldOff.Disable();

            GameObject duplicateHost = CreateHost("__RECOVERY_SCENE_INPUT_MANAGER");
            InputActionManager duplicate = duplicateHost.AddComponent<InputActionManager>();
            InputActionAsset duplicateAsset = CreateAsset("SceneAsset", "SceneAction");
            InputAction duplicateHeldOff = duplicateAsset.FindActionMap("TestMap")
                .AddAction("Translate Anchor", InputActionType.Value);
            duplicate.actionAssets = new List<InputActionAsset> { duplicateAsset };
            duplicateAsset.Enable();
            duplicateHeldOff.Disable();
''')

          replace_once(test, '''            Assert.IsTrue(primaryAsset.enabled, "Primary action asset was not enabled.");
            Assert.IsTrue(duplicateAsset.enabled, "Transferred scene action asset was not enabled.");

            int disabledAgain = PlayerInputSessionGuard.Consolidate("controlled_test_repeat");
''', '''            Assert.IsTrue(primaryAsset.enabled, "Primary action asset was not enabled.");
            Assert.IsTrue(duplicateAsset.enabled, "Transferred scene action asset was not enabled.");
            Assert.IsFalse(primaryHeldOff.enabled,
                "Consolidation re-enabled an intentionally disabled action in the primary asset.");
            Assert.IsFalse(duplicateHeldOff.enabled,
                "Consolidation re-enabled an intentionally disabled action in the transferred asset.");

            int disabledAgain = PlayerInputSessionGuard.Consolidate("controlled_test_repeat");
''')

          replace_once(test, '''            Assert.IsFalse(duplicate.enabled);
            Assert.AreEqual(0, duplicate.actionAssets.Count);

            RecoveryRuntimeCensusSnapshot census = RecoveryRuntimeCensus.Capture(
''', '''            Assert.IsFalse(duplicate.enabled);
            Assert.AreEqual(0, duplicate.actionAssets.Count);
            Assert.IsFalse(primaryHeldOff.enabled,
                "Repeated consolidation changed the primary asset's per-action state.");
            Assert.IsFalse(duplicateHeldOff.enabled,
                "Repeated consolidation changed the transferred asset's per-action state.");

            RecoveryRuntimeCensusSnapshot census = RecoveryRuntimeCensus.Capture(
''')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/recovery-apply-input-session-stability.yml
          git add \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerRigPersistence.cs \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerInputSessionGuard.cs \
            Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryInputSessionGuardTests.cs
          git diff --cached --check
          git commit -m "fix(input): preserve per-action state through travel wiring"
          git push origin HEAD:recovery/input-session-stability
