name: CI

# Compiles the Unity project and runs EditMode tests on every source push/PR.
# Also produces report-only project-contract artifacts. That job is deliberately
# non-blocking until its rules have proven low-noise against the real repo.
#
# REQUIRED repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE  - contents of your Unity Personal .ulf license file
#   UNITY_EMAIL    - your Unity account email
#   UNITY_PASSWORD - your Unity account password

on:
  push:
    branches:
      - main
      - 'claude/**'
      - terry-local-wip
    # Generated proof and handoff-only commits do not change executable source. Excluding them
    # prevents write-back loops and keeps the Unity queue focused on source candidates.
    paths-ignore:
      - docs/CI_VERDICT.md
      - docs/recovery/generated/**
      - docs/HANDOFF.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read

env:
  PROJECT_PATH: Ziptide
  UNITY_VERSION: 2022.3.62f3

jobs:
  continuity-report:
    name: Project contract reports (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run project contract unit tests
        run: |
          python3 -m unittest discover \
            -s tools/tests \
            -p 'test_*_gate.py' \
            -v

      - name: Generate repository continuity report
        if: always()
        run: |
          python3 tools/continuity_gate.py \
            --json-report Builds/Reports/continuity_report.json

      - name: Generate first-hour contract report
        if: always()
        run: |
          python3 tools/first_hour_gate.py \
            --json-report Builds/Reports/first_hour_contract_report.json

      - name: Generate first-hour binding report
        if: always()
        run: |
          python3 tools/first_hour_binding_gate.py \
            --json-report Builds/Reports/first_hour_binding_report.json

      - name: Generate first-hour envelope report
        if: always()
        run: |
          python3 tools/first_hour_envelope_gate.py \
            --json-report Builds/Reports/first_hour_envelope_report.json

      - name: Generate first-hour launch report
        if: always()
        run: |
          python3 tools/first_hour_launch_gate.py \
            --json-report Builds/Reports/first_hour_launch_report.json

      - name: Upload project contract reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-contract-reports
          path: |
            Builds/Reports/continuity_report.json
            Builds/Reports/first_hour_contract_report.json
            Builds/Reports/first_hour_binding_report.json
            Builds/Reports/first_hour_envelope_report.json
            Builds/Reports/first_hour_launch_report.json
          if-no-files-found: warn

  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode tests
        id: unity-tests
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: test-results

      - name: Verify authoritative NUnit result
        if: always()
        shell: bash
        env:
          UNITY_TEST_OUTCOME: ${{ steps.unity-tests.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root_dir = Path('test-results')
          result_files = sorted(root_dir.rglob('*results.xml'))
          if not result_files:
              raise SystemExit('EditMode produced no NUnit result XML.')

          totals = {key: 0 for key in ('total', 'passed', 'failed', 'skipped', 'inconclusive')}
          counted = []
          for path in result_files:
              root = ET.parse(path).getroot()
              if root.tag.split('}')[-1] != 'test-run':
                  continue
              counted.append(path.as_posix())
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0) or 0)
              if root.attrib.get('result') != 'Passed':
                  raise SystemExit(f'NUnit root is not Passed: {path} {root.attrib}')

          if not counted or totals['total'] <= 0:
              raise SystemExit('EditMode produced no counted NUnit tests.')
          if totals['failed'] or totals['skipped'] or totals['inconclusive']:
              raise SystemExit(f'EditMode NUnit gate failed: {totals}')
          if totals['passed'] != totals['total']:
              raise SystemExit(f'EditMode totals are inconsistent: {totals}')

          outcome = os.environ.get('UNITY_TEST_OUTCOME', 'unknown')
          log_text = '\n'.join(
              path.read_text(encoding='utf-8', errors='replace')
              for path in sorted(root_dir.rglob('*.log'))
          )
          if outcome != 'success':
              known_xr_teardown = (
                  'Call to StopSubsystems without an initialized manager' in log_text
                  and 'XRManagerSettings:StopSubsystems' in log_text
              )
              if not known_xr_teardown:
                  raise SystemExit(
                      'GameCI failed despite passing NUnit XML, but the failure was not the known XR teardown.'
                  )
              fatal_markers = (
                  'Scripts have compiler errors',
                  'Compilation failed',
                  'Aborting batchmode due to failure',
                  'Crash!!!',
              )
              found = [marker for marker in fatal_markers if marker in log_text]
              if found:
                  raise SystemExit(f'Fatal Unity markers found after NUnit: {found}')
              print('Accepted passing NUnit XML with the exact known XR shutdown-only failure signature.')

          print(json.dumps({
              'gameCiOutcome': outcome,
              'resultFiles': counted,
              **totals,
          }, indent=2))
          PY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  patch-audit:
    # Runs the same patch + author + bake + shader-safety + audit pipeline as the device build,
    # minus APK packaging. A blocker or required build-hook failure makes this job red.
    name: Patch scenes + world audit (no APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-audit-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-audit-
            Library-

      - name: Patch scenes + run world audit
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: Ziptide.Build.BuildAndroid.PatchScenesAndAudit
          allowDirtyBuild: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-audit-report
          path: |
            docs/AUDIT_REPORT.*
            ${{ env.PROJECT_PATH }}/Builds/Reports/*
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-android-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-android-
            Library-

      - name: Build (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: Ziptide.Build.BuildAndroid.PatchScenesThenAPK
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ziptide-apk
          path: ${{ env.PROJECT_PATH }}/Builds/Android/Ziptide.apk
          if-no-files-found: warn

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: |
            docs/AUDIT_REPORT.*
            ${{ env.PROJECT_PATH }}/Builds/Reports/*
          if-no-files-found: warn

  record-verdict:
    name: Record durable CI verdict (non-blocking)
    needs:
      - continuity-report
      - test
      - patch-audit
      - build-android
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/terry-local-wip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout current branch head
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Refuse stale verdict writes
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          tested="${{ github.sha }}"
          current="$(git rev-parse HEAD)"
          echo "tested=$tested"
          echo "current=$current"

          if [[ "$current" == "$tested" ]]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git cat-file -e "${tested}^{commit}"
          changed="$(git diff --name-only "$tested" HEAD)"
          echo "$changed"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              docs/recovery/generated/*|docs/CI_VERDICT.md|docs/HANDOFF.md)
                ;;
              *)
                echo "write=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Branch advanced through proof-relevant path '$path'; newer source owns the verdict."
                exit 0
                ;;
            esac
          done <<< "$changed"

          echo "write=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Only generated evidence, the verdict, or docs/HANDOFF.md advanced; recording the tested SHA is safe."

      - name: Render verdict file
        if: steps.freshness.outputs.write == 'true'
        env:
          EDITMODE_RESULT: ${{ needs.test.result }}
          PATCH_AUDIT_RESULT: ${{ needs['patch-audit'].result }}
          ANDROID_RESULT: ${{ needs['build-android'].result }}
          CONTRACT_RESULT: ${{ needs['continuity-report'].result }}
        run: |
          python3 tools/ci_verdict.py \
            --output docs/CI_VERDICT.md \
            --repository "${{ github.repository }}" \
            --branch terry-local-wip \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event-name "${{ github.event_name }}" \
            --workflow-name "${{ github.workflow }}" \
            --editmode-result "$EDITMODE_RESULT" \
            --patch-audit-result "$PATCH_AUDIT_RESULT" \
            --android-result "$ANDROID_RESULT" \
            --contract-result "$CONTRACT_RESULT"

      - name: Commit current verdict without forcing
        if: steps.freshness.outputs.write == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/CI_VERDICT.md; then
            echo "::notice::Verdict file already matches this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_VERDICT.md
          git commit -m "ci: record verdict for ${GITHUB_SHA:0:7} [skip ci]"
          if ! git push origin HEAD:terry-local-wip; then
            echo "::warning::Branch advanced during verdict write; newer CI will record the current head."
            exit 0
          fi
