name: CI

# Compiles the Unity project and runs EditMode tests on every push/PR.
# Also produces report-only project-contract artifacts. That job is deliberately
# non-blocking until its rules have proven low-noise against the real repo.
#
# REQUIRED repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE  - contents of your Unity Personal .ulf license file
#   UNITY_EMAIL    - your Unity account email
#   UNITY_PASSWORD - your Unity account password

on:
  push:
    branches:
      - main
      - 'claude/**'
      - terry-local-wip
    # The final recorder changes only this file. Excluding it is a second guard
    # against a write-back loop in addition to GITHUB_TOKEN and [skip ci].
    paths-ignore:
      - docs/CI_VERDICT.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

# unity-test-runner publishes results as a GitHub Check, which needs write access.
# Without this the default GITHUB_TOKEN is read-only and the run fails at the very end
# with "Resource not accessible by integration" even when compile + tests succeed.
permissions:
  checks: write
  contents: read

# The Unity project lives in the Ziptide/ subfolder of the repo.
env:
  PROJECT_PATH: Ziptide
  UNITY_VERSION: 2022.3.62f3

jobs:
  continuity-report:
    name: Project contract reports (non-blocking)
    runs-on: ubuntu-latest
    # FH-02A/FH-01A/FH-01B/FH-01C/FH-01D are observation-only. Findings and even job failure remain
    # visible without blocking Unity tests, Android builds, or another operator's push.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run project contract unit tests
        run: |
          python3 -m unittest discover \
            -s tools/tests \
            -p 'test_*_gate.py' \
            -v

      - name: Generate repository continuity report
        if: always()
        run: |
          python3 tools/continuity_gate.py \
            --json-report Builds/Reports/continuity_report.json

      - name: Generate first-hour contract report
        if: always()
        run: |
          python3 tools/first_hour_gate.py \
            --json-report Builds/Reports/first_hour_contract_report.json

      - name: Generate first-hour binding report
        if: always()
        run: |
          python3 tools/first_hour_binding_gate.py \
            --json-report Builds/Reports/first_hour_binding_report.json

      - name: Generate first-hour envelope report
        if: always()
        run: |
          python3 tools/first_hour_envelope_gate.py \
            --json-report Builds/Reports/first_hour_envelope_report.json

      - name: Generate first-hour launch report
        if: always()
        run: |
          python3 tools/first_hour_launch_gate.py \
            --json-report Builds/Reports/first_hour_launch_report.json

      - name: Upload project contract reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-contract-reports
          path: |
            Builds/Reports/continuity_report.json
            Builds/Reports/first_hour_contract_report.json
            Builds/Reports/first_hour_binding_report.json
            Builds/Reports/first_hour_envelope_report.json
            Builds/Reports/first_hour_launch_report.json
          if-no-files-found: warn

  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

  patch-audit:
    # THE PER-PUSH BUILD GATE (2026-07-14). The Android job below runs the real device pipeline but
    # only on dispatch/main — that blind spot let scene-patcher/audit blockers pile up invisibly
    # from July 5 to July 14 (the W011 phantom-dome SPAWN blocker) while the branch read "GREEN".
    # This job runs the SAME patch + author + audit pipeline (BuildAndroid.PatchScenesAndAudit) on
    # EVERY push, minus the APK — an audit BLOCKER fails this job exactly like it aborts Terry's
    # PC build. Uses the small standalone editor image, not the 12 GB Android one.
    name: Patch scenes + world audit (no APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-audit-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-audit-
            Library-

      - name: Patch scenes + run world audit
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: Ziptide.Build.BuildAndroid.PatchScenesAndAudit
          allowDirtyBuild: true

      # On a red run this report IS the diagnosis — the full blocker list, every scene, one shot.
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-audit-report
          path: |
            docs/AUDIT_REPORT.*
            ${{ env.PROJECT_PATH }}/Builds/Reports/*
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    # Android builds are slow, so they don't run on every push. They run:
    #   - on demand: Actions tab > CI > "Run workflow" (any branch), or an agent triggers it via the
    #     GitHub API after pushing a device-test-worthy change, or
    #   - automatically on push to main.
    # The build runs the SAME path as the local PC build (BuildAndroid.PatchScenesThenAPK): it patches
    # every scene, runs the world audit (a BLOCKER fails the run), then produces the APK — so build
    # breakage is caught in the cloud BEFORE the headset, and the APK is downloadable as an artifact.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      # The Unity Android editor Docker image is ~12 GB and the stock runner ships with only ~14 GB
      # free — the docker pull died with "no space left on device" (run 28547683786). Evict the big
      # preinstalled toolchains we never use (.NET, Android cmdline SDK, Haskell, CodeQL, docker cache)
      # BEFORE pulling; frees ~25-30 GB.
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-android-${{ hashFiles(format('{0}/Assets/**', env.PROJECT_PATH), format('{0}/Packages/**', env.PROJECT_PATH), format('{0}/ProjectSettings/**', env.PROJECT_PATH)) }}
          restore-keys: |
            Library-android-
            Library-

      - name: Build (Android)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          # Run our real build entrypoint (patch scenes + audit + APK) instead of the default build,
          # so CI exercises exactly what the PC build does.
          buildMethod: Ziptide.Build.BuildAndroid.PatchScenesThenAPK
          # The scene patchers modify scenes/assets during the build, which dirties the working tree.
          allowDirtyBuild: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ziptide-apk
          path: ${{ env.PROJECT_PATH }}/Builds/Android/Ziptide.apk
          if-no-files-found: warn

      # The audit writes its full report into the workspace; on a red run it's the ONLY diagnosis
      # source a remote operator has, so ship it as an artifact unconditionally.
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: |
            docs/AUDIT_REPORT.*
            ${{ env.PROJECT_PATH }}/Builds/Reports/*
          if-no-files-found: warn

  record-verdict:
    name: Record durable CI verdict (non-blocking)
    needs:
      - continuity-report
      - test
      - patch-audit
      - build-android
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/terry-local-wip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout current branch head
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Refuse stale verdict writes
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          tested="${{ github.sha }}"
          current="$(git rev-parse HEAD)"
          echo "tested=$tested"
          echo "current=$current"
          if [[ "$current" != "$tested" ]]; then
            echo "write=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Branch advanced; the newer run owns the durable verdict."
          else
            echo "write=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render verdict file
        if: steps.freshness.outputs.write == 'true'
        env:
          EDITMODE_RESULT: ${{ needs.test.result }}
          PATCH_AUDIT_RESULT: ${{ needs['patch-audit'].result }}
          ANDROID_RESULT: ${{ needs['build-android'].result }}
          CONTRACT_RESULT: ${{ needs['continuity-report'].result }}
        run: |
          python3 tools/ci_verdict.py \
            --output docs/CI_VERDICT.md \
            --repository "${{ github.repository }}" \
            --branch terry-local-wip \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --event-name "${{ github.event_name }}" \
            --workflow-name "${{ github.workflow }}" \
            --editmode-result "$EDITMODE_RESULT" \
            --patch-audit-result "$PATCH_AUDIT_RESULT" \
            --android-result "$ANDROID_RESULT" \
            --contract-result "$CONTRACT_RESULT"

      - name: Commit current verdict without forcing
        if: steps.freshness.outputs.write == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/CI_VERDICT.md; then
            echo "::notice::Verdict file already matches this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CI_VERDICT.md
          git commit -m "ci: record verdict for ${GITHUB_SHA:0:7} [skip ci]"
          if ! git push origin HEAD:terry-local-wip; then
            echo "::warning::Branch advanced during verdict write; newer CI will record the current head."
            exit 0
          fi
