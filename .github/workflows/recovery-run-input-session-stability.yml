name: Run bounded input-session stability patch

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-run-input-session-stability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0

      - name: Execute the exact reviewed replacement script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/recovery-apply-input-session-stability.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git config"
          start = helper.index(start_marker) + len(start_marker)
          end = helper.index(end_marker, start)
          script = textwrap.dedent(helper[start:end])
          namespace = {'__name__': '__main__'}
          exec(compile(script, 'bounded_input_session_patch.py', 'exec'), namespace)

          # Tighten the generated guard patch: InputActionManager.OnEnable can itself enable every
          # assigned asset. Snapshot disabled actions from already-live assets before manager
          # activation and restore them immediately afterward. Fully disabled assets remain recovery
          # candidates and are deliberately brought back as complete assets.
          path = Path('Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerInputSessionGuard.cs')
          text = path.read_text(encoding='utf-8')
          old = '''            primary.actionAssets = assets;
            primary.enabled = true;

            // Do not call Enable() on a partially enabled asset. Asset.Enable() re-enables intentional
            // per-action disables (Rotate/Translate Anchor) and rebuilds shared action state mid-travel.
            int recoveredAssets = 0;
            for (int i = 0; i < assets.Count; i++)
            {
                InputActionAsset asset = assets[i];
                if (asset == null || asset.enabled) continue;
                asset.Enable();
                recoveredAssets++;
            }

            int disabled = 0;
'''
          new = '''            var fullyDisabledAssets = new List<InputActionAsset>();
            var intentionallyDisabledActions = new List<InputAction>();
            for (int i = 0; i < assets.Count; i++)
            {
                InputActionAsset asset = assets[i];
                if (asset == null) continue;
                if (!asset.enabled)
                {
                    fullyDisabledAssets.Add(asset);
                    continue;
                }
                foreach (InputActionMap map in asset.actionMaps)
                    foreach (InputAction action in map.actions)
                        if (action != null && !action.enabled)
                            intentionallyDisabledActions.Add(action);
            }

            primary.actionAssets = assets;
            primary.enabled = true;

            // InputActionManager.OnEnable may have enabled every assigned asset. Restore exact
            // per-action disables from assets that were already live before manager activation.
            for (int i = 0; i < intentionallyDisabledActions.Count; i++)
            {
                InputAction action = intentionallyDisabledActions[i];
                if (action != null && action.enabled) action.Disable();
            }

            int recoveredAssets = 0;
            for (int i = 0; i < fullyDisabledAssets.Count; i++)
            {
                InputActionAsset asset = fullyDisabledAssets[i];
                if (asset == null) continue;
                if (!asset.enabled) asset.Enable();
                recoveredAssets++;
            }

            int disabled = 0;
'''
          if text.count(old) != 1:
              raise SystemExit('PlayerInputSessionGuard manager-activation block drifted')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/recovery-apply-input-session-stability.yml \
            .github/workflows/recovery-run-input-session-stability.yml
          git add \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerRigPersistence.cs \
            Ziptide/Assets/Ziptide/Gameplay/Runtime/Player/PlayerInputSessionGuard.cs \
            Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryInputSessionGuardTests.cs
          git diff --cached --check
          git commit -m "fix(input): preserve per-action state through travel wiring"
          git push origin HEAD:terry-local-wip
