name: Recovery Final Source Patch V3

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-final-source-patch-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Apply anchored source edits
        id: apply
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > /tmp/recovery-final-source-patch-v3.log 2>&1
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one anchored match, found {count}")
              p.write_text(updated, encoding="utf-8")

          sub_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/World/ConquestMissionRuntime.cs",
              r"^        private void Start\(\)\n        \{\n            _attempt = ConquestSession\.Pending != null \? ConquestSession\.Pending\.attempt : null;",
              "        private void Awake()\n"
              "        {\n"
              "            if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.ConquestMissionInjector))\n"
              "                enabled = false;\n"
              "        }\n\n"
              "        private void Start()\n"
              "        {\n"
              "            if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.ConquestMissionInjector))\n"
              "            {\n"
              "                enabled = false;\n"
              "                return;\n"
              "            }\n"
              "            _attempt = ConquestSession.Pending != null ? ConquestSession.Pending.attempt : null;")

          sub_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Enemies/EcologyDirector.cs",
              r"^        private void Start\(\)\n        \{\n            ApplyEcology\(\);\n            _instantResolve = false;\n            InvokeRepeating\(nameof\(ApplyEcology\), ReResolveSeconds, ReResolveSeconds\);\n        \}\n\n        private void ApplyEcology\(\)\n        \{\n            string world = gameObject\.scene\.name;",
              "        private void Awake()\n"
              "        {\n"
              "            if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.EcologyInjector))\n"
              "                enabled = false;\n"
              "        }\n\n"
              "        private void Start()\n"
              "        {\n"
              "            if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.EcologyInjector))\n"
              "            {\n"
              "                enabled = false;\n"
              "                return;\n"
              "            }\n"
              "            ApplyEcology();\n"
              "            _instantResolve = false;\n"
              "            InvokeRepeating(nameof(ApplyEcology), ReResolveSeconds, ReResolveSeconds);\n"
              "        }\n\n"
              "        private void ApplyEcology()\n"
              "        {\n"
              "            if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.EcologyInjector))\n"
              "            {\n"
              "                CancelInvoke(nameof(ApplyEcology));\n"
              "                return;\n"
              "            }\n"
              "            string world = gameObject.scene.name;")

          sub_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Locomotion/DashLocomotion.cs",
              r'^            Debug\.Log\("ZIPTIDE: CONTROLS move=left-stick turn=right-stick sprint=hold-L3 autorun=double-L3 crouch=R3 slide=crouch-while-sprinting jump=A menu=hold-Y\+B"\);$',
              '            Debug.Log("ZIPTIDE: CONTROLS move=left-stick turn=right-stick sprint=hold-L3 autorun=double-L3 crouch=R3 slide=crouch-while-sprinting jump=A dev-menu=diagnostic-profile-forehead-gesture");')

          workflow = Path(".github/workflows/recovery-golden-android.yml")
          text = workflow.read_text(encoding="utf-8")
          marker = "      - 'Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryBuildProfileTests.cs'\n"
          if "RecoveryGateBypassTests.cs" not in text:
              additions = (
                  "      - 'Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryGateBypassTests.cs'\n"
                  "      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarpBoard.cs'\n"
                  "      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevMenu.cs'\n"
                  "      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarp.cs'\n"
                  "      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/World/ConquestMissionRuntime.cs'\n"
                  "      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Enemies/EcologyDirector.cs'\n"
                  "      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Pvp/PvpProgressionRuntime.cs'\n"
                  "      - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Photo/QuartersCameraFeature.cs'\n"
                  "      - 'Ziptide/Assets/ZiptideNet/NetBootstrap.cs'\n"
                  "      - 'docs/recovery/automatic_runtime_owners.json'\n"
              )
              if text.count(marker) != 1:
                  raise RuntimeError("Golden workflow insertion marker drifted")
              workflow.write_text(text.replace(marker, marker + additions), encoding="utf-8")

          for cleanup in (
              ".github/workflows/recovery-final-source-patch.yml",
              ".github/workflows/recovery-final-source-patch-v2.yml",
              ".github/workflows/recovery-final-source-patch-v3.yml",
              "docs/recovery/generated/recovery_final_source_patch_failure.md",
              "docs/recovery/generated/recovery_final_source_patch_v2_failure.md",
          ):
              p = Path(cleanup)
              if p.exists(): p.unlink()

          print("anchored source closures applied")
          PY
          code=$?
          cat /tmp/recovery-final-source-patch-v3.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit successful patch
        if: steps.apply.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(recovery): close remaining lifecycle bypasses"
          git push origin HEAD:terry-local-wip

      - name: Record exact v3 failure
        if: steps.apply.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/recovery/generated
          {
            echo '# Recovery Final Source Patch V3 Failure'
            echo
            echo "- Staging SHA: \`${GITHUB_SHA}\`"
            echo "- Exit code: \`${{ steps.apply.outputs.exit_code }}\`"
            echo
            echo '```text'
            sed -n '1,120p' /tmp/recovery-final-source-patch-v3.log
            echo '```'
          } > docs/recovery/generated/recovery_final_source_patch_v3_failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recovery/generated/recovery_final_source_patch_v3_failure.md
          git commit -m "ci(recovery): record final source patch v3 failure [skip ci]"
          git push origin HEAD:terry-local-wip
