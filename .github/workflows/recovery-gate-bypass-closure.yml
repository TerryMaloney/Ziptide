name: Recovery Gate Bypass Closure

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - '.github/workflows/recovery-gate-bypass-closure.yml'

permissions:
  contents: write

concurrency:
  group: recovery-gate-bypass-closure
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false

      - name: Refuse concurrent source changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin terry-local-wip
          event="${GITHUB_SHA}"
          remote="$(git rev-parse origin/terry-local-wip)"
          echo "event=$event"
          echo "remote=$remote"
          if [[ "$event" != "$remote" ]]; then
            changed="$(git diff --name-only "$event" "$remote")"
            echo "$changed"
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                docs/recovery/generated/*|docs/CI_VERDICT.md) ;;
                *) echo "::error::Concurrent non-generated change: $path"; exit 1 ;;
              esac
            done <<< "$changed"
          fi
          git reset --hard "$remote"

      - name: Apply exact gate closures and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}\n--- expected ---\n{old}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarpBoard.cs",
              '''        private void OnEnable() => SceneManager.sceneLoaded += OnSceneLoaded;
              private void OnDisable() => SceneManager.sceneLoaded -= OnSceneLoaded;
          ''',
              '''        private static bool ExposureAllowed =>
                  RecoveryRuntimeGate.Allows(RecoveryFeatureId.DevWarpBoard);

              private void Awake()
              {
                  if (!ExposureAllowed) enabled = false;
              }

              private void OnEnable()
              {
                  if (!ExposureAllowed) { enabled = false; return; }
                  SceneManager.sceneLoaded += OnSceneLoaded;
              }

              private void OnDisable() => SceneManager.sceneLoaded -= OnSceneLoaded;
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarpBoard.cs",
              '''        private void Update()
              {
          ''',
              '''        private void Update()
              {
                  if (!ExposureAllowed) { Hide(); enabled = false; return; }
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarpBoard.cs",
              '''        public void Toggle()
              {
                  if (Visible) Hide(); else Show();
              }
          ''',
              '''        public void Toggle()
              {
                  if (!ExposureAllowed) { Hide(); return; }
                  if (Visible) Hide(); else Show();
              }
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarpBoard.cs",
              '''        public void Show()
              {
                  Hide();
          ''',
              '''        public void Show()
              {
                  Hide();
                  if (!ExposureAllowed) return;
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/World/ConquestMissionRuntime.cs",
              '''        // ── Build ────────────────────────────────────────────────────────────
              private void Start()
              {
                  _attempt = ConquestSession.Pending != null ? ConquestSession.Pending.attempt : null;
          ''',
              '''        // ── Build ────────────────────────────────────────────────────────────
              private void Awake()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.ConquestMissionInjector))
                      enabled = false;
              }

              private void Start()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.ConquestMissionInjector))
                  {
                      enabled = false;
                      return;
                  }
                  _attempt = ConquestSession.Pending != null ? ConquestSession.Pending.attempt : null;
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Enemies/EcologyDirector.cs",
              '''        private void Start()
              {
                  ApplyEcology();
                  _instantResolve = false;
                  InvokeRepeating(nameof(ApplyEcology), ReResolveSeconds, ReResolveSeconds);
              }

              private void ApplyEcology()
              {
                  string world = gameObject.scene.name;
          ''',
              '''        private void Awake()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.EcologyInjector))
                      enabled = false;
              }

              private void Start()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.EcologyInjector))
                  {
                      enabled = false;
                      return;
                  }
                  ApplyEcology();
                  _instantResolve = false;
                  InvokeRepeating(nameof(ApplyEcology), ReResolveSeconds, ReResolveSeconds);
              }

              private void ApplyEcology()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.EcologyInjector))
                  {
                      CancelInvoke(nameof(ApplyEcology));
                      return;
                  }
                  string world = gameObject.scene.name;
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Pvp/PvpProgressionRuntime.cs",
              '''        private void OnEnable()
              {
                  SceneManager.sceneLoaded += OnSceneLoaded;
                  Bind();
              }
          ''',
              '''        private void Awake()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.PvpProgression))
                      enabled = false;
              }

              private void OnEnable()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.PvpProgression))
                  {
                      enabled = false;
                      return;
                  }
                  SceneManager.sceneLoaded += OnSceneLoaded;
                  Bind();
              }
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Pvp/PvpProgressionRuntime.cs",
              '''        private void OnSceneLoaded(Scene s, LoadSceneMode m) => Bind();

              private void Bind()
              {
                  Unbind();
          ''',
              '''        private void OnSceneLoaded(Scene s, LoadSceneMode m)
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.PvpProgression))
                  {
                      Unbind();
                      enabled = false;
                      return;
                  }
                  Bind();
              }

              private void Bind()
              {
                  Unbind();
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.PvpProgression)) return;
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Photo/QuartersCameraFeature.cs",
              '''        private void Start() => BuildFeature();

              public void BuildFeature()
              {
                  Transform old = transform.Find(FeatureRootName); if (old != null) Destroy(old.gameObject);
          ''',
              '''        private void Awake()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.QuartersCameraInjector))
                      enabled = false;
              }

              private void Start()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.QuartersCameraInjector))
                  {
                      enabled = false;
                      return;
                  }
                  BuildFeature();
              }

              public void BuildFeature()
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.QuartersCameraInjector)) return;
                  Transform old = transform.Find(FeatureRootName); if (old != null) Destroy(old.gameObject);
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevMenu.cs",
              '''using UnityEngine.XR.Interaction.Toolkit.UI;
          ''',
              '''using UnityEngine.XR.Interaction.Toolkit.UI;
              using Ziptide.Core;
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevMenu.cs",
              '''        public void Toggle()
              {
                  if (_visible) Hide(); else Show();
              }

              public void Show()
              {
                  // Rebuild fresh each time so the canvas re-registers with the CURRENT scene's EventSystem
          ''',
              '''        private static bool ExposureAllowed =>
                  RecoveryRuntimeGate.Allows(RecoveryFeatureId.DevWarpBoard);

              private void Awake()
              {
                  if (!ExposureAllowed) enabled = false;
              }

              public void Toggle()
              {
                  if (!ExposureAllowed) { Hide(); return; }
                  if (_visible) Hide(); else Show();
              }

              public void Show()
              {
                  if (!ExposureAllowed) { Hide(); return; }
                  // Rebuild fresh each time so the canvas re-registers with the CURRENT scene's EventSystem
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarp.cs",
              '''using UnityEngine.SceneManagement;
          ''',
              '''using UnityEngine.SceneManagement;
              using Ziptide.Core;
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarp.cs",
              '''#if UNITY_EDITOR || DEVELOPMENT_BUILD
                      return true;
              #else
          ''',
              '''#if UNITY_EDITOR || DEVELOPMENT_BUILD
                      return RecoveryRuntimeGate.Allows(RecoveryFeatureId.DevWarpBoard);
              #else
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarp.cs",
              '''        public static void Begin(string sceneName, string markerId)
              {
                  var go = new GameObject("__DevWarpRunner");
          ''',
              '''        public static void Begin(string sceneName, string markerId)
              {
                  if (!RecoveryRuntimeGate.Allows(RecoveryFeatureId.DevWarpBoard)) return;
                  var go = new GameObject("__DevWarpRunner");
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Inventory/QuickSwap.cs",
              '''        /// stay authoritative. B is ignored while Y is held (that chord is the dev menu). Logs
              /// QUICK_SWAP action=swap|holster|draw.
          ''',
              '''        /// stay authoritative. No controller-button chord is reserved for developer UI. Logs
              /// QUICK_SWAP action=swap|holster|draw.
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Inventory/QuickSwap.cs",
              '''        private InputAction _swap;
              private InputAction _menuGuard;
              private XRInteractionManager _mgr;
          ''',
              '''        private InputAction _swap;
              private XRInteractionManager _mgr;
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Inventory/QuickSwap.cs",
              '''            if (_menuGuard == null)
                  {
                      _menuGuard = new InputAction("ZiptideQuickSwapMenuGuard", InputActionType.Button);
                      _menuGuard.AddBinding("<XRController>{LeftHand}/secondaryButton"); // Y
                  }
                  _swap.Enable();
                  _menuGuard.Enable();
          ''',
              '''            _swap.Enable();
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Inventory/QuickSwap.cs",
              '''        private void OnDisable()
              {
                  _swap?.Disable();
                  _menuGuard?.Disable();
              }
          ''',
              '''        private void OnDisable()
              {
                  _swap?.Disable();
              }
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Inventory/QuickSwap.cs",
              '''            if (_swap == null || !_swap.WasPressedThisFrame()) return;
                  if (_menuGuard != null && _menuGuard.IsPressed()) return; // Y+B = dev menu chord

                  Resolve();
          ''',
              '''            if (_swap == null || !_swap.WasPressedThisFrame()) return;

                  Resolve();
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Gameplay/Runtime/Locomotion/DashLocomotion.cs",
              '''            Debug.Log("ZIPTIDE: CONTROLS move=left-stick turn=right-stick sprint=hold-L3 autorun=double-L3 crouch=R3 slide=crouch-while-sprinting jump=A menu=hold-Y+B");
          ''',
              '''            Debug.Log("ZIPTIDE: CONTROLS move=left-stick turn=right-stick sprint=hold-L3 autorun=double-L3 crouch=R3 slide=crouch-while-sprinting jump=A dev-menu=diagnostic-profile-forehead-gesture");
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryExposureProfileTests.cs",
              '''            Assert.IsFalse(profile.Allows(RecoveryFeatureId.QuartersCameraInjector));
          ''',
              '''            Assert.IsFalse(profile.Allows(RecoveryFeatureId.QuartersCameraInjector));
                  Assert.IsFalse(profile.Allows(RecoveryFeatureId.NetBootstrap));
          ''')

          replace_once(
              "Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryGameplayBootstrapGateTests.cs",
              '''            new SourceExpectation("Ziptide/Assets/Ziptide/Gameplay/Runtime/Diagnostics/SingletonValidator.cs", RecoveryFeatureId.SingletonValidator)
          ''',
              '''            new SourceExpectation("Ziptide/Assets/Ziptide/Gameplay/Runtime/Diagnostics/SingletonValidator.cs", RecoveryFeatureId.SingletonValidator),
                  new SourceExpectation("Ziptide/Assets/ZiptideNet/NetBootstrap.cs", RecoveryFeatureId.NetBootstrap)
          ''')

          replace_once(
              ".github/workflows/recovery-golden-android.yml",
              '''      - 'Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryBuildProfileTests.cs'
                  - 'tools/dev_build_install.ps1'
          ''',
              '''      - 'Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryBuildProfileTests.cs'
                  - 'Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryGateBypassTests.cs'
                  - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarpBoard.cs'
                  - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevMenu.cs'
                  - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/DevTools/DevWarp.cs'
                  - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/World/ConquestMissionRuntime.cs'
                  - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Enemies/EcologyDirector.cs'
                  - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Pvp/PvpProgressionRuntime.cs'
                  - 'Ziptide/Assets/Ziptide/Gameplay/Runtime/Photo/QuartersCameraFeature.cs'
                  - 'Ziptide/Assets/ZiptideNet/NetBootstrap.cs'
                  - 'docs/recovery/automatic_runtime_owners.json'
                  - 'tools/dev_build_install.ps1'
          ''')

          test_path = Path("Ziptide/Assets/Ziptide/Tests/PlayMode/RecoveryGateBypassTests.cs")
          if test_path.exists():
              raise SystemExit(f"Refusing to overwrite existing {test_path}")
          test_path.write_text(r'''using System;
          using System.Collections;
          using System.Collections.Generic;
          using System.IO;
          using System.Text.RegularExpressions;
          using NUnit.Framework;
          using UnityEngine;
          using UnityEngine.TestTools;
          using Ziptide.Core;
          using Ziptide.Gameplay;
          using Ziptide.Gameplay.DevTools;

          namespace Ziptide.Tests.PlayMode
          {
              public sealed class RecoveryGateBypassTests
              {
                  private readonly List<GameObject> _created = new List<GameObject>();

                  [UnitySetUp]
                  public IEnumerator SetUp()
                  {
                      RecoveryRuntimeGate.SetActiveProfile(RecoveryExposureProfiles.GoldenSlice);
                      DestroyNamedImmediate("DevWarpBoard");
                      DestroyNamedImmediate("DevMenuCanvas");
                      DestroyNamedImmediate("__DevWarpRunner");
                      yield return null;
                  }

                  [UnityTearDown]
                  public IEnumerator TearDown()
                  {
                      for (int i = 0; i < _created.Count; i++)
                          if (_created[i] != null) UnityEngine.Object.DestroyImmediate(_created[i]);
                      _created.Clear();
                      DestroyNamedImmediate("DevWarpBoard");
                      DestroyNamedImmediate("DevMenuCanvas");
                      DestroyNamedImmediate("__DevWarpRunner");
                      RecoveryRuntimeGate.SetActiveProfile(RecoveryExposureProfiles.FullDevelopment);
                      yield return null;
                  }

                  [Test]
                  public void RuntimeBootstrapDiscovery_CoversActualSourceAttributes()
                  {
                      string repositoryRoot = Path.GetFullPath(Path.Combine(Application.dataPath, "..", ".."));
                      string[] scanRoots =
                      {
                          "Ziptide/Assets/Ziptide/Core/Runtime",
                          "Ziptide/Assets/Ziptide/Gameplay/Runtime",
                          "Ziptide/Assets/ZiptideNet"
                      };
                      const string gateInfrastructure =
                          "Ziptide/Assets/Ziptide/Core/Runtime/Recovery/RecoveryRuntimeGate.cs";
                      var catalogPaths = new HashSet<string>(StringComparer.Ordinal);
                      foreach (var registration in RecoveryAutomaticOwnerCatalog.All)
                          catalogPaths.Add(registration.SourceRelativePath.Replace('\\', '/'));

                      var discovered = new List<string>();
                      var marker = new Regex(@"(?m)^\s*\[RuntimeInitializeOnLoadMethod(?:\s*\(|\s*\])");
                      for (int r = 0; r < scanRoots.Length; r++)
                      {
                          string absoluteRoot = Path.Combine(repositoryRoot, scanRoots[r]);
                          Assert.IsTrue(Directory.Exists(absoluteRoot), "Missing runtime scan root " + scanRoots[r]);
                          foreach (string file in Directory.GetFiles(absoluteRoot, "*.cs", SearchOption.AllDirectories))
                          {
                              string source = File.ReadAllText(file);
                              if (!marker.IsMatch(source)) continue;
                              string relative = file.Substring(repositoryRoot.Length)
                                  .TrimStart(Path.DirectorySeparatorChar, Path.AltDirectorySeparatorChar)
                                  .Replace('\\', '/');
                              if (relative == gateInfrastructure) continue;
                              discovered.Add(relative);
                              Assert.IsTrue(catalogPaths.Contains(relative),
                                  "Real runtime bootstrap is absent from the closed exposure catalog: " + relative);
                          }
                      }

                      Assert.Contains("Ziptide/Assets/ZiptideNet/NetBootstrap.cs", discovered,
                          "The source-driven scan did not inspect the conditional Photon bootstrap.");
                  }

                  [UnityTest]
                  public IEnumerator GoldenSlice_BlocksSceneAuthoredAndPublicBypassPaths()
                  {
                      var board = AddBlocked<DevWarpBoard>("Bypass_DevWarpBoard");
                      var legacyMenu = AddBlocked<DevMenu>("Bypass_DevMenu");
                      var conquest = AddBlocked<ConquestMissionRuntime>("Bypass_Conquest");
                      var ecology = AddBlocked<EcologyDirector>("Bypass_Ecology");
                      var pvp = AddBlocked<PvpProgressionRuntime>("Bypass_Pvp");
                      var quarters = AddBlocked<QuartersCameraFeature>("Bypass_Quarters");
                      yield return null;

                      Assert.IsFalse(board.enabled, "Scene-authored DevWarpBoard remained active in GoldenSlice.");
                      Assert.IsFalse(legacyMenu.enabled, "Scene-authored legacy DevMenu remained active in GoldenSlice.");
                      Assert.IsFalse(conquest.enabled, "Scene-authored ConquestMissionRuntime remained active in GoldenSlice.");
                      Assert.IsFalse(ecology.enabled, "Scene-authored EcologyDirector remained active in GoldenSlice.");
                      Assert.IsFalse(pvp.enabled, "Scene-authored PvpProgressionRuntime remained active in GoldenSlice.");
                      Assert.IsFalse(quarters.enabled, "Scene-authored QuartersCameraFeature remained active in GoldenSlice.");

                      board.Show();
                      board.Toggle();
                      legacyMenu.Show();
                      legacyMenu.Toggle();
                      quarters.BuildFeature();
                      DevWarpRunnerProbe();
                      yield return null;

                      Assert.IsNull(FindSceneObject("DevWarpBoard"), "Blocked board public API created a menu.");
                      Assert.IsNull(FindSceneObject("DevMenuCanvas"), "Blocked legacy menu public API created a canvas.");
                      Assert.IsNull(quarters.transform.Find(QuartersCameraFeature.FeatureRootName),
                          "Blocked Quarters public builder created its feature root.");
                      Assert.IsNull(FindSceneObject("__DevWarpRunner"), "Blocked developer warp API created a persistent runner.");
                      Assert.IsFalse(DevWarp.Enabled, "Developer warp API reports enabled in GoldenSlice.");
                  }

                  private T AddBlocked<T>(string name) where T : MonoBehaviour
                  {
                      var go = new GameObject(name);
                      _created.Add(go);
                      return go.AddComponent<T>();
                  }

                  private static void DevWarpRunnerProbe()
                  {
                      DevWarp.WarpToMarker("Spawn_Player");
                  }

                  private static void DestroyNamedImmediate(string objectName)
                  {
                      var all = Resources.FindObjectsOfTypeAll<GameObject>();
                      for (int i = 0; i < all.Length; i++)
                      {
                          GameObject go = all[i];
                          if (go != null && go.scene.IsValid() && go.name == objectName)
                              UnityEngine.Object.DestroyImmediate(go);
                      }
                  }

                  private static GameObject FindSceneObject(string objectName)
                  {
                      var all = Resources.FindObjectsOfTypeAll<GameObject>();
                      for (int i = 0; i < all.Length; i++)
                      {
                          GameObject go = all[i];
                          if (go != null && go.scene.IsValid() && go.name == objectName)
                              return go;
                      }
                      return null;
                  }
              }
          }
          ''', encoding="utf-8")

          meta = Path(str(test_path) + ".meta")
          meta.write_text('''fileFormatVersion: 2
          guid: 8e31f8c2b95a4b15b334713cb5ce7f21
          MonoImporter:
            externalObjects: {}
            serializedVersion: 2
            defaultReferences: []
            executionOrder: 0
            icon: {instanceID: 0}
            userData:
            assetBundleName:
            assetBundleVariant:
          ''', encoding="utf-8")

          Path(".github/workflows/recovery-gate-bypass-closure.yml").unlink()
          PY

          git diff --check

      - name: Commit bounded closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(recovery): close exposure-gate bypass paths"
          git push origin HEAD:terry-local-wip
