name: Apply handoff queue

on:
  push:
    branches:
      - terry-local-wip
    paths:
      - 'docs/handoff_queue/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handoff-queue-terry-local-wip
  cancel-in-progress: false

jobs:
  apply:
    name: Validate and prepend handoff entries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: terry-local-wip
          fetch-depth: 0
          lfs: false

      - name: Test handoff queue machinery
        run: python3 -m unittest tools/tests/test_handoff_queue_apply.py -v

      - name: Apply queued entries
        run: python3 tools/handoff_queue_apply.py

      - name: Commit consumed entries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/HANDOFF.md docs/handoff_queue
          if git diff --cached --quiet; then
            echo "No queued handoff changes to commit."
            exit 0
          fi
          git commit -m "docs: apply queued handoff entries [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:terry-local-wip; then
              exit 0
            fi
            echo "Push raced with another branch update; rebasing attempt ${attempt}."
            git fetch origin terry-local-wip
            git rebase origin/terry-local-wip
          done
          echo "Unable to publish handoff after three attempts." >&2
          exit 1
